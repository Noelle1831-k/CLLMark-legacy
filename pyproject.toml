[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cllmark"
version = "0.1.0"
description = "Code watermarking through semantics-preserving style rules (legacy CLLMark method) and its benchmark loop"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "tree-sitter==0.20.2",
    "chardet==5.2.0",
]

[project.scripts]
cllmark = "cllmark.cli:main"

[project.urls]
Repository = "https://github.com/Noelle1831-k/CLLMark-legacy"

[tool.setuptools.packages.find]
include = ["cllmark*"]

[tool.setuptools.package-data]
cllmark = ["rules/styles.json"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["corpus", "docs/plans"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PIE"]
ignore = [
    "E501",    # long lines: the formatter wraps code; long string literals and queries stay readable on one line
    "E731",    # rule tables bind small lambdas to names on purpose
    "B023",    # closures over loop variables are evaluated immediately inside the same iteration
    "RUF015",  # rules use list(x)[0]: on empty input it raises IndexError like the original, next(iter(x)) would not
    "SIM108",  # rule guards read better as explicit if/else than as nested conditional expressions
    "RUF001",  # rule docstrings quote non-ASCII source text verbatim
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["cllmark", "benchmarks"]


[tool.ruff.lint.per-file-ignores]
"tools/*.py" = ["E402"]  # scripts put the repository on sys.path before importing it
